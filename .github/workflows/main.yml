name: CI/CD Docker Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout
      - uses: actions/checkout@v4

      # Login Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build tags (latest, fecha, sha)
      - name: Generate version tags
        id: vars
        run: |
          DATE_TAG=$(date +'%Y.%m.%d')
          echo "DATE_TAG=$DATE_TAG" >> $GITHUB_ENV

      # Build + Push docker image
      - name: Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/travelandrepeatdev:${{ env.DATE_TAG }}

      # Deploy a VPS vía SSH
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "== Pulling latest Docker image =="
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/travelandrepeatdev:latest

            echo "== Stopping old container =="
            docker stop tyr-fe || true

            echo "== Removing old container =="
            docker rm tyr-fe || true

            echo "== Starting new container =="
            docker run -d \
              --name tyr-fe \
              -p 80:3000 \
              ${{ secrets.DOCKERHUB_USERNAME }}/travelandrepeatdev:latest

            echo "== Deployment completed =="

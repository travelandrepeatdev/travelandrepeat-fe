name: CI/CD GHCR Deploy to VPS and send to Docker Hub

on:
  push:
    branches:
      - 'release/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout
      - uses: actions/checkout@v4

      # Generate version tags
      - name: Generate version tags
        id: vars
        run: |
          DATE_TAG=$(date +'%Y.%m.%d')
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "DATE_TAG=$DATE_TAG" >> $GITHUB_ENV
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

      # Login to GHCR Github Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ github.repository_owner }} # assuming same username as GHCR
          password: ${{ secrets.DOCKERHUB_USERNAME_FORGITHUB }}

      # Build and push Docker image to GHCR
      - name: Build & Push Image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/travelandrepeatdev:latest
            ghcr.io/${{ github.repository_owner }}/travelandrepeatdev:${{ env.DATE_TAG }}
            ghcr.io/${{ github.repository_owner }}/travelandrepeatdev:${{ env.SHORT_SHA }}
            ${{ github.repository_owner }}/travelandrepeatdev:latest

      # Deploy to VPS
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }} # user app-github in vps
          key: ${{ secrets.VPS_SSH_KEY }}
          # Always pulled image from GHCR to keep it private
          script: |
            echo "== Logging into GHCR =="
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            echo "== Pulling latest image =="
            docker pull ghcr.io/${{ github.repository_owner }}/travelandrepeatdev:latest

            echo "== Stopping old container =="
            docker stop tyr-fe || true

            echo "== Removing old container =="
            docker rm tyr-fe || true

            echo "== Starting new container =="
            docker run -d \
              --name tyr-fe \
              -p 3000:3000 \
              -e NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }} \
              ghcr.io/${{ github.repository_owner }}/travelandrepeatdev:latest

            echo "== Deployment completed successfully =="